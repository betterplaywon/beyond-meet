name: Keep Render.com Server Alive

on:
  schedule:
    # 5분마다 실행 (cron 표현식: */5 * * * *)
    # GitHub Actions는 최소 5분 간격 지원
    - cron: '*/5 * * * *'

  # 수동 실행 가능
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        run: |
          echo "🏓 Pinging Render.com server..."

          # 최대 3회 재시도 (Render.com cold start 대응)
          max_attempts=3
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."

            # 타임아웃 120초 설정 (cold start는 보통 60-90초)
            # set +e로 curl 실패 시에도 스크립트가 계속 실행되도록 함
            set +e
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 120 \
              --connect-timeout 10 \
              https://beyond-meet-api.onrender.com/health)
            curl_exit_code=$?
            set -e

            # curl 실패 시 response를 000으로 설정
            if [ $curl_exit_code -ne 0 ]; then
              response="000"
              echo "⚠️ Curl exit code: $curl_exit_code"
              case $curl_exit_code in
                28) echo "   Reason: Operation timeout (server took >120s to respond)" ;;
                6)  echo "   Reason: Could not resolve host" ;;
                7)  echo "   Reason: Failed to connect to host" ;;
                *)  echo "   Reason: Unknown curl error" ;;
              esac
            fi

            # HTTP 200이고 curl이 성공한 경우에만 성공으로 판단
            if [ "$response" = "200" ] && [ $curl_exit_code -eq 0 ]; then
              echo "✅ Server is alive! (HTTP $response)"
              exit 0
            else
              echo "⚠️ Attempt $attempt failed: HTTP $response (curl exit: $curl_exit_code)"
              if [ $attempt -lt $max_attempts ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi
            fi

            attempt=$((attempt + 1))
          done

          echo "❌ All attempts failed"
          exit 1

      - name: Show Server Status
        if: success()
        run: |
          echo "📊 Server Status:"
          curl -s --max-time 10 https://beyond-meet-api.onrender.com/health
