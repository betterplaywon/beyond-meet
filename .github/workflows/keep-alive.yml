name: Keep Render.com Server Alive

on:
  schedule:
    # 5분마다 실행 (cron 표현식: */5 * * * *)
    # GitHub Actions는 최소 5분 간격 지원
    - cron: '*/5 * * * *'

  # 수동 실행 가능
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        run: |
          echo "🏓 Pinging Render.com server..."

          # 최대 3회 재시도 (Render.com cold start 대응)
          max_attempts=3
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."

            # 타임아웃 120초 설정 (cold start는 보통 60-90초)
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 120 \
              --connect-timeout 10 \
              https://beyond-meet-api.onrender.com/health)

            if [ $response -eq 200 ]; then
              echo "✅ Server is alive! (HTTP $response)"
              exit 0
            else
              echo "⚠️ Attempt $attempt failed: HTTP $response"
              if [ $attempt -lt $max_attempts ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi
            fi

            attempt=$((attempt + 1))
          done

          echo "❌ All attempts failed"
          exit 1

      - name: Show Server Status
        if: success()
        run: |
          echo "📊 Server Status:"
          curl -s --max-time 10 https://beyond-meet-api.onrender.com/health
